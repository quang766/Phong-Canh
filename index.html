<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thư viện ảnh</title>
    <link rel="stylesheet" href="style.css">
</head>
<body onload="pageLoaded()">

    <div class="gallery">

        <img id="mainImage"
             src="https://picsum.photos/id/1018/800/450"
             alt="Ảnh lớn">

        <p id="caption">Bầu trời đầy mây và thung lũng</p>

        <div class="thumbnails">

    <img src="https://picsum.photos/id/1015/200/120"
         alt="Con đường giữa núi"
         onclick="changeImage(this)"
         onmouseover="changeImage(this)"
         onmouseleave="changeImage(this)"
         onfocus="changeImage(this)"
         onblur="changeImage(this)">

    <img src="https://picsum.photos/id/1016/200/120"
         alt="Thung lũng xanh"
         onclick="changeImage(this)"
         onmouseover="changeImage(this)"
         onmouseleave="changeImage(this)"
         onfocus="changeImage(this)"
         onblur="changeImage(this)">

    <img src="https://picsum.photos/id/1011/200/120"
         alt="Hồ nước trên núi"
         onclick="changeImage(this)"
         onmouseover="changeImage(this)"
         onmouseleave="changeImage(this)"
         onfocus="changeImage(this)"
         onblur="changeImage(this)">
    <img src="https://picsum.photos/id/1043/200/120"
         alt="Tàu hỏa và núi"
         onclick="changeImage(this)"
         onmouseover="changeImage(this)"
         onmouseleave="changeImage(this)"
         onfocus="changeImage(this)"
         onblur="changeImage(this)">

    <img src="https://picsum.photos/id/1019/200/120"
         alt="Biển và núi"
         onclick="changeImage(this)"
         onmouseover="changeImage(this)"
         onmouseleave="changeImage(this)"
         onfocus="changeImage(this)"
         onblur="changeImage(this)">

    <img src="https://picsum.photos/id/1025/200/120"
         alt="Chú chó đang nhìn về phía trước"
         onclick="changeImage(this)"
         onmouseover="changeImage(this)"
         onmouseleave="changeImage(this)"
         onfocus="changeImage(this)"
         onblur="changeImage(this)">

</div>
    </div>

    <script src="script.js"></script>

</body>
</html>
